- id: sandbox
  config:
    runnerCommand: [ "bwrap", "--unshare-net" ]
    runnerFailureSignatures: [ "bwrap: " ]
- id: hmr
  config:
    root: [ '.' ]
- insert:
    - id: creator-playbook
      name: ./src/creator-playbook.ts
    - id: prompt
      name: ./src/prompt.ts
    - id: fork-at
      name: ./src/fork-at/index.ts
    - id: approve-for-me
      name: ./src/approve-for-me/index.ts
    - id: stop-after-reject
      name: ./src/stop-after-reject.ts
    - id: api
      name: ./src/api.ts
    - id: think-expand
      name: "@mzzsfy/dsh-think-expand"
    - id: michengai-btw
      name: "@michengai/dsh-btw"
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: llm-pi-ai
  config:
    providers:
      newapi:
        displayName: NewAPI
        api: openai-completions
        baseURL: https://llm.ani.llc/v1
        apiKeyEnv: NEWAPI_API_KEY
        models:
          - id: deepseek-v4-pro
            contextWindow: 1048576
            maxTokens: 393216
            reasoningEfforts: { low: low, high: high, max: max }
          - id: deepseek-flash
            contextWindow: 1048576
            maxTokens: 393216
            reasoningEfforts: { low: low, high: high, max: max }
          - id: deepseek-chat
            contextWindow: 131072
            maxTokens: 8192
          - id: deepseek-reasoner
            contextWindow: 131072
            maxTokens: 65536
          - id: gpt-6-sol
          - id: gpt-5.6-sol
          - id: grok-4.7
          - id: kimi-k2.6
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
